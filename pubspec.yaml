name: youban
description: 游伴 - 智能语音导游APP，为自由行游客提供智能语音讲解服务
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 定位服务
  geolocator: ^11.0.0

  # 语音服务
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  # 相机
  camera: ^0.10.5+9

  # 网络
  http: ^1.2.0

  # 本地存储
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # 通知
  flutter_local_notifications: ^16.3.0

  # 权限
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/